# --- Server Config ---
# Core runs on the default port 8080
server.port=8081
spring.application.name=cloud-core

# --- Database Config (Must match docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/cloud_deploy_db
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Create tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Kafka Config ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=core-group
spring.kafka.consumer.auto-offset-reset=earliest

# --- Kafka Producer (Core sends JSON) ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer