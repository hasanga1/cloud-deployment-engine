server.port=9000
spring.application.name=auth-service

# Connect to the NEW auth_db (Port 5433 on host, but standard internal port if using docker)
# Since you run via 'mvn spring-boot:run', use localhost:5433
spring.datasource.url=jdbc:postgresql://localhost:5433/auth_db
spring.datasource.username=admin
spring.datasource.password=password

# Create tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret (Must be same in Cloud Core later)
jwt.secret=MySuperSecretKeyForSigningTokens1234567890!
jwt.expiration=86400000