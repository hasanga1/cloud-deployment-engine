server:
  port: 8080 # The main entry point for Frontend

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Route 1: Auth Service
        - id: auth-service
          uri: http://localhost:9000
          predicates:
            - Path=/auth/**
            
        # Route 2: Cloud Core
        - id: cloud-core
          uri: http://localhost:9001
          predicates:
            - Path=/api/**
            
        # Route 3: WebSockets (Upgrade Support)
        - id: cloud-ws
          uri: ws://localhost:9001
          predicates:
            - Path=/ws/**