# --- Server Configuration ---
# Runs this service on port 8081 to avoid conflict with Core API (8080)
server.port=8082

# --- Application Metadata ---
spring.application.name=cloud-orchestrator

# --- Logging Configuration ---
# Keep logs clean, but show INFO for our app
logging.level.root=INFO
# Docker Java can be very chatty, let's keep it to WARN unless debugging
logging.level.com.github.dockerjava=WARN

# --- Kafka Configuration ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=orchestrator-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*