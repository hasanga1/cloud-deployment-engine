version: '3.8'

services:
  # 1. PostgreSQL - Holds project info and deployment history
  postgres:
    image: postgres:15
    container_name: cloud_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloud_deploy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Zookeeper - Required for Kafka management
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: cloud_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # 3. Kafka - The Event Bus
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: cloud_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      # Listeners allow us to connect from host (localhost:9092) and inside docker
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    
  # 4. THE REVERSE PROXY
  traefik:
    image: traefik:v2.10
    container_name: cloud_traefik
    command:
      - "--api.insecure=true" # Enable Dashboard
      - "--providers.docker=true" # Listen to Docker
      - "--providers.docker.exposedbydefault=false" # Don't expose Postgres/Kafka by accident
      - "--entrypoints.web.address=:80" # Listen on HTTP
    ports:
      - "80:80"     # The Public Entrypoint
      - "8080:8080" # The Dashboard (Traefik uses 8080 internal, map to something else if conflict)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Needs to see other containers

volumes:
  postgres_data: