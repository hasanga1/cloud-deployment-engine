version: '3.8'

services:
  # --- INFRASTRUCTURE (Databases, Kafka) ---
  postgres:
    image: postgres:15
    container_name: cloud_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloud_deploy_db
    ports:
      - "5432:5432"
    networks:
      - cloud_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth_postgres:
    image: postgres:15
    container_name: auth_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    networks:
      - cloud_network
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: cloud_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - cloud_network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: cloud_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - cloud_network

  traefik:
    image: traefik:v2.10
    container_name: cloud_traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cloud_network

  # --- APPLICATION SERVICES (NEW!) ---

  # 1. API GATEWAY (Publicly Accessible)
  api-gateway:
    build: ./api-gateway
    container_name: cloud_gateway
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      # 👇 SIMPLE VARIABLES (Matches application.yml)
      - AUTH_URI=http://auth-service:9000
      - CORE_URI=http://cloud-core:9001
      - CORE_WS_URI=ws://cloud-core:9001
    depends_on:
      - auth-service
      - cloud-core
    networks:
      - cloud_network

  # 2. AUTH SERVICE (Private / Hidden)
  auth-service:
    build: ./auth-service
    container_name: auth-service
    # NO PORTS MAPPED! <--- LOCKED DOWN
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auth_postgres:5432/auth_db
    depends_on:
      - auth_postgres
    networks:
      - cloud_network

  # 3. CLOUD CORE (Private / Hidden)
  cloud-core:
    build: ./cloud-core
    container_name: cloud-core
    # NO PORTS MAPPED! <--- LOCKED DOWN
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cloud_deploy_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres
      - kafka
    networks:
      - cloud_network

  # 4. ORCHESTRATOR (Private / Hidden)
  cloud-orchestrator:
    build: ./cloud-orchestrator
    container_name: cloud-orchestrator
    # NO PORTS MAPPED! <--- LOCKED DOWN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Needs to talk to Docker
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DOCKER_NETWORK_NAME=cloud_network
    depends_on:
      - kafka
    networks:
      - cloud_network

volumes:
  postgres_data:
  auth_postgres_data:

networks:
  cloud_network:
    name: cloud_network